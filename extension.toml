id = "gams"
name = "GAMS"
description = "Syntax highlighting and language configuration for GAMS (General Algebraic Modeling System)."
version = "0.1.0"
schema_version = 1
authors = ["lolow <ldrouet@pm.me>"]
repository = "https://github.com/lolow/gams-zed"

# Grammar source.
#
# Local development: the `file://` URL below points to the sibling
# `tree-sitter-gams/` working tree on this machine. To install on another
# machine, either (a) push the parser to a public git repository and
# replace `repository` with that URL, or (b) edit `repository` to the
# absolute path of your local clone.
#
# The pinned `rev` is the head of the local fork — see
# ../tree-sitter-gams/NOTICE for upstream attribution.
[grammars.gams]
repository = "file:///home/lolow/Sync/06-DEVEL/gams-language/tree-sitter-gams"
# Commit SHA of the v0.1.0 tag. Zed's grammar fetcher does a shallow
# clone that doesn't pull tags from a file:// source, so we point at
# the commit directly. After publishing the parser to a public remote,
# you can switch this back to `rev = "v0.1.0"`.
rev = "3c2c799b89e238304f099bc811d105926a4bfbf9"
